sonar.organization=timlps
sonar.projectKey=TimLps_CesiZen

# L'analyse porte sur l'API : c'est là que se trouvent l'authentification,
# les contrôles d'accès et les accès aux données.
sonar.sources=api/src/app,api/src/routes,api/src/database,api/src/config
sonar.tests=api/src/tests

sonar.exclusions=**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/node_modules/**,**/build/**

# Analysés pour la recherche de défauts, mais exclus de la mesure de couverture :
# config/ ne contient que des tableaux de configuration, et les migrations sont
# rejouées par le framework, pas appelées par du code applicatif. Mesurer leur
# couverture ne renseignerait sur rien.
sonar.coverage.exclusions=**/config/**,**/database/migrations/**

sonar.php.coverage.reportPaths=api/src/coverage.xml

sonar.sourceEncoding=UTF-8

# Environnement de développement.
# Code monté depuis l'hôte (modification sans rebuild), debug actif,
# base de données accessible depuis un client SQL local.

services:
  app:
    build:
      target: dev
    volumes:
      - ./api/src:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: debug

  web:
    volumes:
      - ./api/src:/var/www/html
    ports:
      # 8001 et non 8000 : c'est le port sur lequel pointent les deux clients
      # Flutter (backoffice/lib/core/network/api_client.dart et son équivalent
      # mobile). Le changer imposerait de modifier les deux applications.
      - "8001:80"

  db:
    ports:
      - "3307:3306"   # exposée à l'hôte pour DBeaver / TablePlus
